<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archery</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="cloud.css" />
    <link rel="stylesheet" href="dropfx.css" />
  </head>
  <body>
    <div id="splash" class="splash">
      <div class="splash-text">
        <div class="splash-word">Archer<span class="wm-y">y</span></div>
        <div class="splash-sub">A Visual Library for Creative Research</div>
      </div>
    </div>

    <header id="onbSteps" class="onb-steps" data-tauri-drag-region hidden></header>

    <div id="welcome" class="welcome onb" hidden>
      <div id="welcomeCol" class="onb-col"></div>
    </div>

    <div id="lock" class="p-lock onb" hidden>
      <form id="lockList" class="onb-col" novalidate></form>
    </div>

    <div id="app" class="app" hidden>
      <div class="p-drag" data-tauri-drag-region></div>
      <main id="zones" class="zones-grid"></main>
      <aside id="info" class="info-panel" hidden></aside>
      <aside id="sheet" class="p-sheet"></aside>
      <div id="dropbar" class="p-dropbar" hidden></div>
      <header id="top" class="p-top" data-tauri-drag-region>
      <nav id="nav" class="p-nav">
        <button type="button" id="navBrand" class="p-nav-btn p-nav-brand">Archer<span class="wm-y">y</span></button>
        <span class="p-nav-rule"></span>
        <div id="navMain" class="p-nav-main"></div>
        <label class="p-nav-search" id="navSearch">
          <span id="navSearchLabel"></span>
          <input id="search" type="search" spellcheck="false" autocomplete="off" />
        </label>
        <div class="p-nav-more">
          <button type="button" id="navMore" class="p-nav-btn">⋯</button>
        </div>
      </nav>
      </header>
      <div id="libTab" class="p-lib-tab" hidden>
        <button type="button" id="libTabBtn" class="p-nav-btn"></button>
      </div>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <div class="lightbox-stage" id="lightboxStage"><img id="lightboxImg" alt="" /></div>
      <div id="lbMedia" class="lb-media" hidden></div>
      <aside id="lbInfo" class="lb-info"></aside>
      <aside id="lbText" class="lb-caption" hidden></aside>
      <div id="lbZones" class="lb-bar lb-zones" hidden></div>
      <nav class="lb-bar lb-nav">
        <span id="lbBrowse" class="lb-group">
          <button type="button" id="lightboxPrev" class="lb-btn lb-arrow" aria-label="Previous">‹</button>
          <span id="lbCount" class="lb-count"></span>
          <button type="button" id="lightboxNext" class="lb-btn lb-arrow" aria-label="Next">›</button>
          <span class="lb-sep"></span>
        </span>
        <span id="lbName" class="lb-name"></span>
        <button type="button" id="lightboxZoom" class="lb-btn lb-zoom"></button>
        <span id="lbTones" class="lb-tones tone-picker" hidden></span>
        <button type="button" id="lbTextBtn" class="lb-btn" hidden></button>
        <button type="button" id="lbCloudBtn" class="lb-btn"></button>
        <button type="button" id="lbInfoBtn" class="lb-btn"></button>
        <button type="button" id="lbSourceBtn" class="lb-btn"></button>
        <button type="button" id="lbOfflineBtn" class="lb-btn" hidden></button>
        <button type="button" id="lbRestoreBtn" class="lb-btn" hidden></button>
        <button type="button" id="lbRemoveBtn" class="lb-btn lb-remove" hidden></button>
        <button type="button" id="lbAction" class="lb-btn lb-action"></button>
      </nav>
    </div>

    <div id="modal" class="modal" hidden></div>
    <div id="toasts" class="toasts"></div>

    <script src="i18n.js"></script>
    <script src="manual.js"></script>
    <script src="media.js"></script>
    <script src="reveal.js"></script>
    <script src="search.js"></script>
    <script src="cloud.js"></script>
    <script src="dropfx.js"></script>
    <script src="app.js"></script>
  </body>
</html>
